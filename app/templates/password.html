{% extends "base.html" %}{% block title %}{{ t('password.title') }}{% endblock %}
{% block body %}
<h1>{{ t('password.title') }}</h1>
{% if forced %}<div class="flash">{{ t('password.forced') }}</div>{% endif %}
<form class="card" method="post" action="/admin/password" style="max-width:520px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>{{ t('field.password_current') }}</label><input type="password" name="current" autocomplete="current-password" required autofocus>
  <label>{{ t('field.password_new') }}</label><input type="password" name="password" autocomplete="new-password" minlength="10" required>
  <label>{{ t('field.password_again') }}</label><input type="password" name="password2" autocomplete="new-password" minlength="10" required>
  <p class="muted">{{ t('password.rule') }}</p>
  <p><button class="primary">{{ t('password.submit') }}</button></p>
</form>
{% endblock %}
