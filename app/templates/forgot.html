{% extends "base.html" %}{% block title %}{{ t('forgot.title') }}{% endblock %}
{% block body %}
<div class="card narrow">
  <h1>{{ t('forgot.title') }}</h1>
  <p class="muted">{{ t('forgot.intro') }}</p>
  <form method="post" action="/admin/forgot">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('field.email') }}</label><input type="email" name="email" autocomplete="email" required autofocus>
    <p><button class="primary">{{ t('forgot.submit') }}</button></p>
  </form>
  <p class="muted"><a href="/admin/login">{{ t('login.title') }}</a></p>
</div>
{% endblock %}
