# nginx for the school information API: paste inside the site's server { } (with TLS). Behind Cloudflare, keep the
# real-IP lines; without it, drop them.
# Cloudflare in front: only its ranges may set the client address (real IP for rate limits and login lockout).
# Refresh the ranges now and then: https://www.cloudflare.com/ips (fetched 2026-11-09).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# uploads through the admin UI / ingest API (Cloudflare's free plan allows 100 MB per request)
client_max_body_size 210m;   # web uploads: UPLOAD_MAX_TOTAL_MB (200) plus the form

location / {
    proxy_pass http://127.0.0.1:8000;                  # compose.yml / compose.gpu.yml (API_PORT)
    # proxy_pass http://unix:/srv/school-api/run/api.sock:;   # a compose.local.yml with a Unix socket instead
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # the real client (after real_ip), not a forwarded chain
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
}
